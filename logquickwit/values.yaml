global:
  storageClass: ceph-rbd

mongodb:
  enabled: true
  image:
    repository: mongo
    tag: "6.0"
    pullPolicy: IfNotPresent
  
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "2Gi"
      cpu: "1000m"
  
  persistence:
    enabled: true
    storageClass: ceph-rbd
    size: 50Gi
    accessMode: ReadWriteOnce

quickwit:
  enabled: true
  image:
    repository: quickwit/quickwit
    tag: "latest"
    pullPolicy: IfNotPresent
  
  replicaCount: 1
  
  service:
    type: ClusterIP
    port: 7280
  
  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "4Gi"
      cpu: "2000m"
  
  persistence:
    enabled: true
    storageClass: ceph-rbd
    size: 100Gi
    accessMode: ReadWriteOnce
  
  env:
    - name: QW_ENABLE_JAEGER_EXPORTER
      value: "false"

graylog:
  enabled: true
  image:
    repository: graylog/graylog
    tag: "5.2"
    pullPolicy: IfNotPresent
  
  replicaCount: 1
  
  service:
    type: LoadBalancer
    webPort: 9000

  ingress:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
    hosts:
      - host: graylog.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: graylog-tls
        hosts:
          - graylog.example.com
  
  # Input ports for log collection
  inputs:
    syslog:
      tcp:
        enabled: true
        port: 1514
      udp:
        enabled: true
        port: 1514
    gelf:
      tcp:
        enabled: true
        port: 12201
      udp:
        enabled: true
        port: 12201
  
  resources:
    requests:
      memory: "2Gi"
      cpu: "1000m"
    limits:
      memory: "4Gi"
      cpu: "2000m"
  
  persistence:
    data:
      enabled: true
      storageClass: ceph-rbd
      size: 50Gi
      accessMode: ReadWriteOnce
    journal:
      enabled: true
      storageClass: ceph-rbd
      size: 100Gi
      accessMode: ReadWriteOnce

  config:
    passwordSecret: "somepasswordpepper-CHANGE-THIS"
    # Password: admin (generate with: echo -n "yourpassword" | sha256sum)
    rootPasswordSha2: "8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918"
    rootUsername: "admin"
    httpExternalUri: "http://graylog.example.com/"
    rootTimezone: "UTC"