{{- if .Values.mongodb.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "logquickwit.fullname" . }}-mongodb
  labels:
    app: mongodb
    {{- include "logquickwit.labels" . | nindent 4 }}
spec:
  type: {{ .Values.mongodb.service.type }}
  ports:
    - port: {{ .Values.mongodb.service.port }}
      targetPort: 27017
      protocol: TCP
      name: mongodb
  selector:
    app: mongodb
    {{- include "logquickwit.selectorLabels" . | nindent 4 }}
{{- end }}
