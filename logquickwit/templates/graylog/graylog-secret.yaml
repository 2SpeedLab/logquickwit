{{- if .Values.graylog.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "central-logging.fullname" . }}-graylog-secret
  labels:
    {{- include "central-logging.labels" . | nindent 4 }}
type: Opaque
stringData:
  password-secret: {{ .Values.graylog.config.passwordSecret | quote }}
  root-password-sha2: {{ .Values.graylog.config.rootPasswordSha2 | quote }}
{{- end }}