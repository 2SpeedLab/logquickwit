{{- if .Values.graylog.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "central-logging.fullname" . }}-graylog
  labels:
    app: graylog
    {{- include "central-logging.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.graylog.replicaCount }}
  selector:
    matchLabels:
      app: graylog
  template:
    metadata:
      labels:
        app: graylog
    spec:
      containers:
        - name: graylog
          image: "{{ .Values.graylog.image.repository }}:{{ .Values.graylog.image.tag }}"
          imagePullPolicy: {{ .Values.graylog.image.pullPolicy }}
          ports:
            - containerPort: 9000
              name: web
        {{- if .Values.graylog.inputs.syslog.tcp.enabled }}
            - containerPort: {{ .Values.graylog.inputs.syslog.tcp.port }}
              name: syslog-tcp
              protocol: TCP
        {{- end }}
        {{- if .Values.graylog.inputs.syslog.udp.enabled }}
            - containerPort: {{ .Values.graylog.inputs.syslog.udp.port }}
              name: syslog-udp
              protocol: UDP
        {{- end }}
        {{- if .Values.graylog.inputs.gelf.tcp.enabled }}
            - containerPort: {{ .Values.graylog.inputs.gelf.tcp.port }}
              name: gelf-tcp
              protocol: TCP
        {{- end }}
        {{- if .Values.graylog.inputs.gelf.udp.enabled }}
            - containerPort: {{ .Values.graylog.inputs.gelf.udp.port }}
              name: gelf-udp
              protocol: UDP
        {{- end }}
          env:
            - name: GRAYLOG_PASSWORD_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "central-logging.fullname" . }}-graylog-secret
                  key: password-secret
            - name: GRAYLOG_ROOT_PASSWORD_SHA2
              valueFrom:
                secretKeyRef:
                  name: {{ include "central-logging.fullname" . }}-graylog-secret
                  key: root-password-sha2
            - name: GRAYLOG_ROOT_USERNAME
              value: {{ .Values.graylog.config.rootUsername | quote }}
            - name: GRAYLOG_HTTP_EXTERNAL_URI
              value: {{ .Values.graylog.config.httpExternalUri | quote }}
            - name: GRAYLOG_MONGODB_URI
              value: "mongodb://{{ include "central-logging.fullname" . }}-mongodb:27017/graylog"
            - name: GRAYLOG_ELASTICSEARCH_HOSTS
              value: "http://{{ include "central-logging.fullname" . }}-quickwit:7280"
            - name: GRAYLOG_ROOT_TIMEZONE
              value: {{ .Values.graylog.config.rootTimezone | quote }}
          volumeMounts:
            - name: graylog-data
              mountPath: /usr/share/graylog/data
            - name: graylog-journal
              mountPath: /usr/share/graylog/data/journal
          resources:
          {{- toYaml .Values.graylog.resources | nindent 10 }}
          livenessProbe:
            httpGet:
              path: /api/system/lbstatus
              port: 9000
            initialDelaySeconds: 120
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/system/lbstatus
              port: 9000
            initialDelaySeconds: 60
            periodSeconds: 10
      volumes:
        - name: graylog-data
          persistentVolumeClaim:
            claimName: {{ include "central-logging.fullname" . }}-graylog-data-pvc
        - name: graylog-journal
          persistentVolumeClaim:
            claimName: {{ include "central-logging.fullname" . }}-graylog-journal-pvc
{{- end }}