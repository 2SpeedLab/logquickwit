{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "logquickwit.serviceAccountName" . }}
  labels:
    {{- include "logquickwit.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
---
# Add this helper function to templates/_helpers.tpl if not exists
{{- /*
Create the name of the service account to use
*/ -}}
{{- define "logquickwit.serviceAccountName" -}}
{{- if .Values.serviceAccount.create }}
{{- default (include "logquickwit.fullname" .) .Values.serviceAccount.name }}
{{- else }}
{{- default "default" .Values.serviceAccount.name }}
{{- end }}
{{- end }}